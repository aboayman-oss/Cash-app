<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#111827">
    <title>Safe Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style type="text/tailwindcss">
        @layer utilities {
            .no-scrollbar::-webkit-scrollbar { display: none; }
            .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        }
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] { -moz-appearance: textfield; }

        .pin-disabled { opacity: 0.5; pointer-events: none; }

        /* ---- Balance flash animation on success ---- */
        @keyframes balance-flash {
            0%   { color: #ffffff; transform: scale(1); }
            35%  { color: #10b981; transform: scale(1.06); }
            100% { color: #ffffff; transform: scale(1); }
        }
        .flash-balance { animation: balance-flash 0.9s ease-out; }

        /* ---- Skeleton pulse ---- */
        @keyframes sk-pulse {
            0%, 100% { opacity: 1; }
            50%      { opacity: 0.4; }
        }
        .skeleton { animation: sk-pulse 1.4s ease-in-out infinite; }

        /* ---- Modal transitions ---- */
        .modal-hidden { opacity: 0; pointer-events: none; }
        .modal-visible { opacity: 1; pointer-events: auto; }
        .modal-card-hidden { transform: scale(0.96) translateY(8px); opacity: 0; }
        .modal-card-visible { transform: scale(1) translateY(0); opacity: 1; }

        /* ---- Slide-down toast ---- */
        .toast-hidden { transform: translateY(-120%); opacity: 0; }
        .toast-visible { transform: translateY(0); opacity: 1; }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 font-sans antialiased selection:bg-blue-500/30 min-h-screen flex flex-col pb-6">

    <!-- ============== Toast notifications ============== -->
    <div id="notification-area"
         class="fixed top-0 left-0 right-0 z-50 flex flex-col items-center gap-2 p-4 pointer-events-none transition-all duration-300 toast-hidden">
    </div>

    <!-- ============== Confirm Modal (custom, dark) ============== -->
    <div id="confirm-modal"
         class="fixed inset-0 z-50 flex items-center justify-center p-5 bg-black/70 backdrop-blur-sm transition-opacity duration-200 modal-hidden">
        <div id="confirm-modal-card"
             class="w-full max-w-sm bg-gray-800 border border-gray-700 rounded-3xl p-6 shadow-2xl transition-all duration-200 modal-card-hidden">
            <div class="flex items-start gap-4">
                <div id="confirm-icon-wrap"
                     class="flex-shrink-0 w-11 h-11 rounded-full bg-rose-500/15 text-rose-400 flex items-center justify-center">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                              d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                    </svg>
                </div>
                <div class="flex-1 min-w-0">
                    <h3 id="confirm-title" class="text-base font-bold text-white">Void this transaction?</h3>
                    <p id="confirm-message" class="text-sm text-gray-400 mt-1 leading-relaxed">
                        This can't be undone. The amount will be removed from the running balance.
                    </p>
                </div>
            </div>
            <div class="flex gap-3 mt-6">
                <button id="confirm-cancel"
                        class="flex-1 bg-gray-700 hover:bg-gray-600 text-gray-100 font-semibold text-sm py-3 rounded-xl transition-colors">
                    Cancel
                </button>
                <button id="confirm-accept"
                        class="flex-1 bg-rose-500 hover:bg-rose-600 text-white font-semibold text-sm py-3 rounded-xl transition-colors">
                    Void
                </button>
            </div>
        </div>
    </div>

    <!-- ============== Admin Modal ============== -->
    <div id="admin-modal"
         class="fixed inset-0 z-50 flex items-center justify-center p-5 bg-black/70 backdrop-blur-sm transition-opacity duration-200 modal-hidden">
        <div id="admin-modal-card"
             class="w-full max-w-md max-h-[85vh] overflow-y-auto no-scrollbar bg-gray-800 border border-gray-700 rounded-3xl shadow-2xl transition-all duration-200 modal-card-hidden">

            <!-- Header -->
            <div class="flex items-center justify-between px-6 pt-5 pb-4 border-b border-gray-700 sticky top-0 bg-gray-800 rounded-t-3xl z-10">
                <h3 class="text-base font-bold text-white flex items-center gap-2">
                    <svg class="w-4 h-4 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                              d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                    </svg>
                    <span id="admin-modal-title">Admin Access</span>
                </h3>
                <button id="admin-close"
                        class="text-gray-400 hover:text-white p-1 rounded-lg transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>
            </div>

            <!-- Step 1: admin PIN login -->
            <div id="admin-login-step" class="p-6">
                <p class="text-sm text-gray-400 mb-4 leading-relaxed">
                    Enter the admin PIN to manage users, PINs, and avatars.
                </p>
                <input type="password" id="admin-pin-input" inputmode="numeric" placeholder="••••"
                       class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-3.5 text-white outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 tracking-[0.5em] font-mono text-xl text-center">
                <button id="admin-login-btn"
                        class="w-full mt-4 bg-blue-600 hover:bg-blue-500 text-white font-semibold text-sm py-3.5 rounded-xl transition-colors">
                    Enter
                </button>
            </div>

            <!-- Step 2: user management -->
            <div id="admin-manage-step" class="hidden">
                <!-- Existing users -->
                <div class="px-6 pt-5">
                    <h4 class="text-xs font-bold tracking-widest text-gray-500 uppercase mb-3">Current Users</h4>
                    <div id="admin-user-list" class="flex flex-col gap-2"></div>
                </div>

                <!-- Add new user -->
                <div class="px-6 pt-6 pb-6 mt-4 border-t border-gray-700">
                    <h4 class="text-xs font-bold tracking-widest text-gray-500 uppercase mb-3">Add New User</h4>
                    <div class="flex flex-col gap-3">
                        <input type="text" id="new-username" placeholder="Username (no spaces)"
                               class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 text-white outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 text-sm">
                        <input type="password" id="new-pin" inputmode="numeric" placeholder="PIN (digits only)"
                               class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 text-white outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 text-sm tracking-widest">
                        <input type="text" id="new-display-name" placeholder="Display name (optional)"
                               class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 text-white outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 text-sm">
                        <select id="new-color"
                                class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 text-white outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 text-sm">
                            <option value="blue">Blue</option>
                            <option value="indigo">Indigo</option>
                            <option value="emerald">Emerald</option>
                            <option value="amber">Amber</option>
                            <option value="rose">Rose</option>
                            <option value="purple">Purple</option>
                            <option value="cyan">Cyan</option>
                            <option value="pink">Pink</option>
                        </select>
                        <button id="add-user-btn"
                                class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold text-sm py-3.5 rounded-xl transition-colors flex items-center justify-center gap-2">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"/>
                            </svg>
                            Add User
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <main class="max-w-md mx-auto w-full flex flex-col px-5 py-6 flex-1">

        <!-- ============== Header (with admin gear) ============== -->
        <header class="mb-8 flex-shrink-0 text-center relative" id="global-header">
            <button id="admin-gear-btn"
                    class="absolute right-0 top-0 text-gray-500 hover:text-white bg-gray-800 hover:bg-gray-700 p-2 rounded-xl transition-colors"
                    title="Admin">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                </svg>
            </button>
            <div class="inline-flex items-center justify-center w-12 h-12 bg-gray-800 border border-gray-700 rounded-2xl mb-3 shadow-sm">
                <svg class="w-6 h-6 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                </svg>
            </div>
            <h1 class="text-2xl font-bold tracking-tight text-white">Safe Manager</h1>
        </header>

        <!-- ============== Login View ============== -->
        <section id="login-view" class="flex flex-col gap-8 w-full mt-4">

            <div class="flex flex-col gap-3">
                <span class="text-sm font-medium text-gray-400 text-center uppercase tracking-wider">Select Profile</span>
                <!-- User grid is rendered dynamically by app.js -->
                <div id="user-grid" class="grid grid-cols-2 gap-3"></div>
            </div>

            <div id="pin-container" class="flex flex-col gap-2 pin-disabled transition-opacity duration-300">
                <span id="pin-label" class="text-sm font-medium text-gray-400 text-center">Enter PIN</span>
                <div class="relative">
                    <input type="password" id="pin-input" inputmode="numeric" pattern="[0-9]*" placeholder="••••"
                           class="w-full bg-gray-800 border border-gray-700 rounded-2xl px-4 py-4 text-white outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 tracking-[0.5em] font-mono text-2xl shadow-inner transition-all text-center">
                    <div id="login-spinner"
                         class="absolute inset-0 bg-gray-800 rounded-2xl flex items-center justify-center hidden">
                        <svg class="animate-spin h-6 w-6 text-blue-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"/>
                        </svg>
                    </div>
                </div>
            </div>

        </section>

        <!-- ============== Dashboard View ============== -->
        <section id="dashboard-view" class="flex flex-col gap-8 hidden w-full">

            <div class="flex justify-between items-center border-b border-gray-800 pb-4">
                <div class="flex items-center gap-3">
                    <div id="user-avatar-mini"
                         class="w-8 h-8 rounded-full bg-blue-600/20 text-blue-400 flex items-center justify-center font-bold text-sm border border-blue-500/30">
                        A
                    </div>
                    <span id="logged-in-user" class="text-sm font-bold text-white tracking-wide">Ayman</span>
                </div>
                <div class="flex items-center gap-2">
                    <button id="refresh-btn"
                            class="text-gray-400 hover:text-white bg-transparent hover:bg-gray-800 p-2 rounded-lg transition-colors"
                            title="Refresh">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                  d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                        </svg>
                    </button>
                    <button id="logout-btn"
                            class="text-xs font-semibold text-gray-400 hover:text-white bg-transparent hover:bg-gray-800 px-3 py-1.5 rounded-lg transition-colors">
                        Logout
                    </button>
                </div>
            </div>

            <div class="flex flex-col items-center justify-center py-4 relative">
                <div class="absolute w-32 h-32 bg-blue-500/10 rounded-full blur-3xl pointer-events-none"></div>
                <span class="text-xs text-gray-500 font-bold tracking-widest uppercase mb-1 z-10">Safe Balance</span>
                <h2 id="current-balance"
                    class="text-6xl font-extrabold text-white tracking-tighter z-10 drop-shadow-sm transition-colors duration-300">
                    <span class="text-2xl text-gray-500 font-medium mr-1">EGP</span>0.00
                </h2>
            </div>

            <!-- ============== Transaction Form ============== -->
            <form id="transaction-form" class="flex flex-col gap-3" autocomplete="off">
                <input type="number" id="amount-input" inputmode="decimal" min="0" step="0.01"
                       placeholder="Amount (e.g. 150)"
                       class="w-full bg-gray-800 border-none rounded-xl pl-4 pr-4 py-4 text-white outline-none focus:ring-1 focus:ring-blue-500 font-medium text-lg placeholder-gray-500 transition-all">

                <div class="relative">
                    <input type="text" id="desc-input" maxlength="150" placeholder="What is this for?"
                           class="w-full bg-gray-800 border-none rounded-xl pl-4 pr-16 py-4 text-white outline-none focus:ring-1 focus:ring-blue-500 font-medium text-sm placeholder-gray-500 transition-all">
                    <span id="desc-counter"
                          class="absolute right-3 top-1/2 -translate-y-1/2 text-[11px] font-mono text-gray-500 pointer-events-none select-none">
                        0/150
                    </span>
                </div>

                <div class="flex gap-3 mt-1">
                    <button type="submit" data-type="IN" id="btn-deposit"
                            class="flex-1 bg-emerald-500/10 hover:bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 active:bg-emerald-500/30 disabled:opacity-50 font-semibold text-sm py-3.5 rounded-xl transition-all flex items-center justify-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"/>
                        </svg>
                        Deposit
                    </button>
                    <button type="submit" data-type="OUT" id="btn-withdraw"
                            class="flex-1 bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/30 active:bg-rose-500/30 disabled:opacity-50 font-semibold text-sm py-3.5 rounded-xl transition-all flex items-center justify-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M20 12H4"/>
                        </svg>
                        Withdraw
                    </button>
                </div>
            </form>

            <div class="flex flex-col mt-4">
                <div class="flex items-center justify-between mb-3">
                    <h3 class="text-xs font-bold tracking-widest text-gray-500 uppercase">Recent Activity</h3>
                    <span id="last-refreshed" class="text-[10px] text-gray-600 font-medium"></span>
                </div>
                <div id="history-container" class="flex flex-col"></div>
            </div>
        </section>

    </main>

    <script src="app.js"></script>
</body>
</html>
