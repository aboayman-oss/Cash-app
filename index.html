<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#111827"> 
    <title>Safe Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style type="text/tailwindcss">
        @layer utilities {
            .no-scrollbar::-webkit-scrollbar {
                display: none;
            }
            .no-scrollbar {
                -ms-overflow-style: none;
                scrollbar-width: none;
            }
        }
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] {
            -moz-appearance: textfield;
        }
        /* Subtly hide PIN until user is selected */
        .pin-disabled {
            opacity: 0.5;
            pointer-events: none;
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 font-sans antialiased selection:bg-blue-500/30 min-h-screen flex flex-col pb-6">

    <div id="notification-area" class="fixed top-0 left-0 right-0 z-50 flex flex-col gap-2 p-4 pointer-events-none transition-all duration-300 transform -translate-y-full opacity-0">
        </div>

    <main class="max-w-md mx-auto w-full flex flex-col px-5 py-6 flex-1">
        
        <header class="mb-8 flex-shrink-0 text-center" id="global-header">
            <div class="inline-flex items-center justify-center w-12 h-12 bg-gray-800 border border-gray-700 rounded-2xl mb-3 shadow-sm">
                <svg class="w-6 h-6 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                </svg>
            </div>
            <h1 class="text-2xl font-bold tracking-tight text-white">Safe Manager</h1>
        </header>

        <section id="login-view" class="flex flex-col gap-8 w-full mt-4">
            
            <div class="flex flex-col gap-3">
                <span class="text-sm font-medium text-gray-400 text-center uppercase tracking-wider">Select Profile</span>
                <div id="user-grid" class="grid grid-cols-2 gap-3">
                    <button class="user-btn bg-gray-800 border border-gray-700/60 rounded-2xl p-4 flex flex-col items-center gap-3 hover:bg-gray-700 transition focus:outline-none" data-user="Ayman">
                        <div class="w-12 h-12 rounded-full bg-blue-500/10 text-blue-400 flex items-center justify-center text-xl font-bold border border-blue-500/20">A</div>
                        <span class="text-white font-medium">Ayman</span>
                    </button>
                    <button class="user-btn bg-gray-800 border border-gray-700/60 rounded-2xl p-4 flex flex-col items-center gap-3 hover:bg-gray-700 transition focus:outline-none" data-user="Sakr">
                        <div class="w-12 h-12 rounded-full bg-indigo-500/10 text-indigo-400 flex items-center justify-center text-xl font-bold border border-indigo-500/20">S</div>
                        <span class="text-white font-medium">Sakr</span>
                    </button>
                    <button class="user-btn bg-gray-800 border border-gray-700/60 rounded-2xl p-4 flex flex-col items-center gap-3 hover:bg-gray-700 transition focus:outline-none" data-user="El3taby">
                        <div class="w-12 h-12 rounded-full bg-emerald-500/10 text-emerald-400 flex items-center justify-center text-xl font-bold border border-emerald-500/20">E</div>
                        <span class="text-white font-medium">El3taby</span>
                    </button>
                    <button class="user-btn bg-gray-800 border border-gray-700/60 rounded-2xl p-4 flex flex-col items-center gap-3 hover:bg-gray-700 transition focus:outline-none" data-user="S3od">
                        <div class="w-12 h-12 rounded-full bg-amber-500/10 text-amber-400 flex items-center justify-center text-xl font-bold border border-amber-500/20">S</div>
                        <span class="text-white font-medium">S3od</span>
                    </button>
                </div>
            </div>

            <div id="pin-container" class="flex flex-col gap-2 pin-disabled transition-opacity duration-300">
                <span id="pin-label" class="text-sm font-medium text-gray-400 text-center">Enter PIN</span>
                <div class="relative">
                    <input type="password" id="pin-input" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="••••" class="w-full bg-gray-800 border border-gray-700 rounded-2xl px-4 py-4 text-white outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 tracking-[0.5em] font-mono text-2xl shadow-inner transition-all text-center">
                    <div id="login-spinner" class="absolute inset-0 bg-gray-800 rounded-2xl flex items-center justify-center hidden">
                        <svg class="animate-spin h-6 w-6 text-blue-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                    </div>
                </div>
            </div>

        </section>

        <section id="dashboard-view" class="flex flex-col gap-8 hidden w-full">
            
            <div class="flex justify-between items-center border-b border-gray-800 pb-4">
                <div class="flex items-center gap-3">
                    <div id="user-avatar-mini" class="w-8 h-8 rounded-full bg-blue-600/20 text-blue-400 flex items-center justify-center font-bold text-sm border border-blue-500/30">
                        A
                    </div>
                    <span id="logged-in-user" class="text-sm font-bold text-white tracking-wide">Ahmed Ayman</span>
                </div>
                <button id="logout-btn" class="text-xs font-semibold text-gray-400 hover:text-white bg-transparent hover:bg-gray-800 px-3 py-1.5 rounded-lg transition-colors">
                    Logout
                </button>
            </div>

            <div class="flex flex-col items-center justify-center py-4 relative">
                <div class="absolute w-32 h-32 bg-blue-500/10 rounded-full blur-3xl pointer-events-none"></div>
                <span class="text-xs text-gray-500 font-bold tracking-widest uppercase mb-1 z-10">Safe Balance</span>
                <h2 id="current-balance" class="text-6xl font-extrabold text-white tracking-tighter z-10 drop-shadow-sm">
                    <span class="text-2xl text-gray-500 font-medium mr-1">EGP</span>0.00
                </h2>
            </div>

            <div class="flex flex-col gap-3">
                <div class="flex flex-col gap-3">
                    <div class="relative">
                        <input type="number" id="amount-input" inputmode="decimal" min="0" step="0.01" placeholder="Amount (e.g. 150)" class="w-full bg-gray-800 border-none rounded-xl pl-4 pr-4 py-4 text-white outline-none focus:ring-1 focus:ring-blue-500 font-medium text-lg placeholder-gray-500 transition-all">
                    </div>
                    
                    <div class="relative">
                        <input type="text" id="desc-input" autocomplete="off" maxlength="50" placeholder="What is this for?" class="w-full bg-gray-800 border-none rounded-xl pl-4 pr-4 py-4 text-white outline-none focus:ring-1 focus:ring-blue-500 font-medium text-sm placeholder-gray-500 transition-all">
                    </div>
                </div>

                <div class="flex gap-3 mt-1">
                    <button id="btn-deposit" class="flex-1 bg-emerald-500/10 hover:bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 active:bg-emerald-500/30 disabled:opacity-50 font-semibold text-sm py-3.5 rounded-xl transition-all flex items-center justify-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"></path></svg>
                        Deposit
                    </button>
                    <button id="btn-withdraw" class="flex-1 bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/30 active:bg-rose-500/30 disabled:opacity-50 font-semibold text-sm py-3.5 rounded-xl transition-all flex items-center justify-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M20 12H4"></path></svg>
                        Withdraw
                    </button>
                </div>
            </div>

            <div class="flex flex-col mt-4">
                <h3 class="text-xs font-bold tracking-widest text-gray-500 uppercase mb-3">Recent Activity</h3>
                <div id="history-container" class="flex flex-col">
                    </div>
            </div>
        </section>

    </main>

    <script src="app.js"></script>
</body>
</html>
